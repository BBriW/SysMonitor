<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时硬件监控</title>
<style>
  :root{
    --bg:#05070b;
    --txt:#e6edf6;
    --muted:#7d8b9e;
    --dim:#55637a;
    --line:rgba(255,255,255,.07);
    --cpu:#38bdf8;
    --gpu:#a78bfa;
    --mem:#34d399;
    --disk:#fbbf24;
    --net:#f472b6;
    --ok:#34d399;
    --warn:#fbbf24;
    --bad:#f87171;
    --card1:rgba(23,30,42,.92);
    --card2:rgba(13,18,26,.94);
  }
  *{box-sizing:border-box}
  html,body{overflow:hidden;height:100%}
  body{overflow:hidden;
    margin:0;
    background:
      radial-gradient(1100px 600px at 12% -12%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(900px 520px at 92% -6%, rgba(167,139,250,.10), transparent 60%),
      var(--bg);
    color:var(--txt);
    font:14px/1.45 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .app{padding:10px 14px 10px;max-width:1600px;margin:0 auto;height:100vh;display:flex;flex-direction:column;box-sizing:border-box}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:11px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;position:relative;
    background:linear-gradient(145deg,#1e5f86,#0f2436);
    box-shadow:0 0 0 1px rgba(56,189,248,.35),0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
    display:grid;place-items:center;
  }
  .logo::before{content:"";width:15px;height:15px;border-radius:50%;border:2px solid #38bdf8;box-shadow:0 0 12px #38bdf8}
  .logo::after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;margin-left:-22px;opacity:.9}
  h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
  .hstats{display:flex;align-items:center;gap:18px}
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .stat span{color:var(--dim);font-size:10.5px;letter-spacing:.6px}
  .stat b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    font-size:12px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.10);color:#9df3cd;
    white-space:nowrap;transition:.3s;
  }
  .pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.6s infinite}
  .pill.off{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.10);color:#fcd34d}
  .pill.dead{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.10);color:#fca5a5}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .btn{
    background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line);
    border-radius:9px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;
  }
  .btn:hover{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.35)}

  /* ---------------- grid ---------------- */
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:minmax(0,.82fr) minmax(0,1.5fr) minmax(0,1fr);gap:10px}
  .card{
    background:linear-gradient(180deg,var(--card1),var(--card2));
    border:1px solid var(--line);border-radius:15px;padding:10px 14px 10px;position:relative;
    box-shadow:0 10px 26px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045);
    min-width:0;
  }
  .card::before{content:"";position:absolute;left:15px;right:15px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent,transparent),transparent);opacity:.55}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:18px}
  .card-head h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.4px;color:#c3cfdd}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none}
  .tag{
    margin-left:auto;font-size:10px;padding:2px 7px;border-radius:999px;color:var(--muted);
    border:1px solid var(--line);background:rgba(255,255,255,.03);white-space:nowrap;
  }

  .kpi{grid-column:span 3;--accent:var(--cpu);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:2px;min-height:0}
  .kbody{overflow:hidden;position:relative;height:99px;min-height:0;display:grid;place-items:center;overflow:hidden}
  .ring{width:101px;height:101px;transform:rotate(-90deg);overflow:visible}
  .ring circle{fill:none;stroke-width:8.5;stroke-linecap:round}
  .ring .track{stroke:rgba(255,255,255,.055)}
  .ring .val{stroke:var(--accent);stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1),stroke .4s;filter:drop-shadow(0 0 7px rgba(56,189,248,.45))}
  .knum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .knum b{font-size:29px;font-weight:650;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
  .knum b.na{font-size:24px;color:var(--dim)}
  .knum i{font-style:normal;font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.5px}
  .kfoot{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
  .spark{width:100%;height:27px;display:block;margin-top:3px}

  .trend{grid-column:span 7;--accent:var(--cpu);display:flex;flex-direction:column}
  .trend .chartwrap{position:relative;flex:1;min-height:120px}
  .legend{display:flex;gap:14px;margin-left:auto;font-size:11px;color:var(--muted)}
  .legend b{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}

  .side{grid-column:span 5;min-height:0;display:flex;flex-direction:column;gap:9px;background:transparent;border:0;box-shadow:none;padding:0}
  .side .card{padding:8px 12px 8px}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .big small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px;letter-spacing:0}
  .muted{color:var(--muted);font-size:11.5px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
  .bar>span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(255,255,255,.10)}
  .vols{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 10px;margin-top:7px}
  .vol{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
  .vol .vbar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .vol .vbar>span{display:block;height:100%;border-radius:99px;transition:width .5s}
  .vol b{color:#c3cfdd;font-weight:600;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

  .cores{grid-column:span 4;--accent:var(--cpu);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .corelist{display:flex;gap:6px;align-items:flex-end;flex:1;min-height:0;margin-top:4px}
  .core{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
  .core .col{background:linear-gradient(180deg,var(--cpu),rgba(56,189,248,.35));border-radius:4px 4px 2px 2px;transition:height .45s cubic-bezier(.4,0,.2,1);min-height:2px;box-shadow:0 0 8px rgba(56,189,248,.25)}
  .core .cl{text-align:center;font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}

  .gpu{grid-column:span 3;--accent:var(--gpu);min-height:0;overflow:hidden}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:4px}
  .kv div{font-size:11px;color:var(--dim)}
  .kv b{display:block;font-size:14px;color:#dbe6f2;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}

  .procs{grid-column:span 5;--accent:var(--net);min-height:0;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:2px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.4px;padding:3px 6px;border-bottom:1px solid var(--line)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:3px 6px;color:#c3cfdd;border-bottom:1px solid rgba(255,255,255,.035);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  tr:last-child td{border-bottom:0}
  .pbar{width:52px;height:4px;border-radius:99px;background:rgba(255,255,255,.07);display:inline-block;vertical-align:middle;overflow:hidden}
  .pbar>span{display:block;height:100%;background:var(--net);border-radius:99px;transition:width .4s}

  .hot{--accent:var(--bad) !important}
  .warm{--accent:var(--warn) !important}
  .flash{animation:hotflash 1.1s ease-in-out infinite alternate}
  @keyframes hotflash{from{box-shadow:0 10px 26px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(248,113,113,.05)}to{box-shadow:0 10px 26px rgba(248,113,113,.22),inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(248,113,113,.45)}}
  @media (max-width:1180px){
    .kpi{grid-column:span 6}.trend,.side,.cores,.gpu,.procs{grid-column:span 12}
    .trend .chartwrap{height:200px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div style="min-width:0">
        <h1>实时硬件监控</h1>
        <div class="sub" id="hostline">正在连接采集器…</div>
      </div>
    </div>
    <div class="hstats">
      <div class="stat"><span>已运行</span><b id="uptime">--</b></div>
      <div class="stat"><span>当前时间</span><b id="clock">--:--:--</b></div>
      <div class="pill off" id="conn"><i></i><span>连接中</span></div>
      <button class="btn" id="quit">退出</button>
    </div>
  </header>

  <main class="grid">
    <!-- CPU 温度 -->
    <section class="card kpi" id="card-cputemp" style="--accent:var(--cpu)">
      <div class="card-head"><span class="dot"></span><h2>CPU 温度</h2><span class="tag" id="tag-temp">--</span></div>
      <div class="kbody">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="val" id="ring-temp" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="knum"><b id="v-temp">--</b><i>°C</i></div>
      </div>
      <div class="kfoot" id="f-temp">等待数据…</div>
      <canvas class="spark" id="sp-temp"></canvas>
    </section>

    <!-- CPU 占用 -->
    <section class="card kpi" id="card-cpu" style="--accent:var(--cpu)">
      <div class="card-head"><span class="dot"></span><h2>CPU 占用</h2><span class="tag" id="tag-cpu">--</span></div>
      <div class="kbody">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="val" id="ring-cpu" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="knum"><b id="v-cpu">--</b><i>%</i></div>
      </div>
      <div class="kfoot" id="f-cpu">等待数据…</div>
      <canvas class="spark" id="sp-cpu"></canvas>
    </section>

    <!-- GPU 温度 -->
    <section class="card kpi" id="card-gputemp" style="--accent:var(--gpu)">
      <div class="card-head"><span class="dot"></span><h2>GPU 温度</h2><span class="tag" id="tag-gputemp">--</span></div>
      <div class="kbody">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="val" id="ring-gputemp" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="knum"><b id="v-gputemp">--</b><i>°C</i></div>
      </div>
      <div class="kfoot" id="f-gputemp">等待数据…</div>
      <canvas class="spark" id="sp-gputemp"></canvas>
    </section>

    <!-- GPU 占用 -->
    <section class="card kpi" id="card-gpu" style="--accent:var(--gpu)">
      <div class="card-head"><span class="dot"></span><h2>GPU 占用</h2><span class="tag" id="tag-gpu">--</span></div>
      <div class="kbody">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="val" id="ring-gpu" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="knum"><b id="v-gpu">--</b><i>%</i></div>
      </div>
      <div class="kfoot" id="f-gpu">等待数据…</div>
      <canvas class="spark" id="sp-gpu"></canvas>
    </section>

    <!-- 趋势 -->
    <section class="card trend">
      <div class="card-head">
        <span class="dot"></span><h2>温度 / 负载趋势</h2>
        <div class="legend">
          <span>CPU 温度 <b id="lg-cput">--</b></span>
          <span>GPU 温度 <b id="lg-gput">--</b></span>
          <span>CPU 负载 <b id="lg-cpuu">--</b></span>
          <span>GPU 负载 <b id="lg-gpuu">--</b></span>
        </div>
      </div>
      <div class="chartwrap"><canvas id="chart" style="width:100%;height:100%;display:block"></canvas></div>
    </section>

    <!-- 右侧：内存 / 磁盘 / 网络 -->
    <div class="side">
      <section class="card" style="--accent:var(--mem)">
        <div class="card-head"><span class="dot"></span><h2>内存</h2><span class="tag" id="tag-mem">--</span></div>
        <div class="row"><div class="big" id="mem-used">--<small>GB</small></div><div class="muted" id="mem-total">--</div></div>
        <div class="bar"><span id="mem-bar" style="width:0%"></span></div>
        <div class="muted" id="mem-page" style="margin-top:6px">--</div>
      </section>

      <section class="card" style="--accent:var(--disk)">
        <div class="card-head"><span class="dot"></span><h2>磁盘</h2><span class="tag" id="tag-vols">--</span></div>
        <div class="row"><div class="big" id="disk-rw">--</div><div class="muted" id="disk-rw2"></div></div>
        <div class="vols" id="vols"></div>
      </section>

      <section class="card" style="--accent:var(--net)">
        <div class="card-head"><span class="dot"></span><h2>网络</h2><span class="tag" id="tag-net">--</span></div>
        <div class="row"><div class="big" id="net-rx">--</div><div class="muted" id="net-tx"></div></div>
      </section>
    </div>

    <!-- 逐核 -->
    <section class="card cores">
      <div class="card-head"><span class="dot"></span><h2>逐核占用</h2><span class="tag" id="tag-cores">--</span></div>
      <div class="corelist" id="corelist"></div>
    </section>

    <!-- GPU 详情 -->
    <section class="card gpu">
      <div class="card-head"><span class="dot"></span><h2>GPU</h2><span class="tag" id="tag-gpudetail">--</span></div>
      <div class="bar" style="margin-top:2px"><span id="vram-bar" style="width:0%"></span></div>
      <div class="muted" id="vram-txt" style="margin-top:6px">--</div>
      <div class="kv">
        <div>核心频率<b id="g-clock">--</b></div>
        <div>显存频率<b id="g-mclock">--</b></div>
        <div>风扇<b id="g-fan">--</b></div>
        <div>功耗<b id="g-pow">--</b></div>
      </div>
    </section>

    <!-- 进程 -->
    <section class="card procs">
      <div class="card-head"><span class="dot"></span><h2>占用最高的进程</h2><span class="tag" id="tag-procs">CPU / 内存</span></div>
      <table>
        <thead><tr><th>进程</th><th class="num">CPU</th><th class="num">内存</th><th style="width:60px">负载</th></tr></thead>
        <tbody id="procbody"></tbody>
      </table>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';
  const MAXP = 240;
  let hist = [];
  const $ = (id) => document.getElementById(id);
  const fmt = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v)) ? '--' : Number(v).toFixed(d);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function dur(sec) {
    if (sec === null || sec === undefined) return '--';
    sec = Math.round(sec);
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    if (d > 0) return d + ' 天 ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  function tempColor(t) {
    if (t === null || t === undefined) return '#55637a';
    if (t < 45) return '#34d399';
    if (t < 60) return '#38bdf8';
    if (t < 75) return '#fbbf24';
    return '#f87171';
  }

  /* ---------------- 环形仪表 ---------------- */
  const CIRC = 326.73;
  function ring(el, pct, color) {
    if (!el) return;
    pct = clamp(pct || 0, 0, 100);
    el.style.strokeDashoffset = String(CIRC * (1 - pct / 100));
    if (color) {
      el.style.stroke = color;
      el.style.filter = 'drop-shadow(0 0 7px ' + color + '99)';
    }
  }

  /* ---------------- 迷你折线 ---------------- */
  function spark(canvas, values, color, fixedMin, fixedMax) {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 200, h = canvas.clientHeight || 36;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pts = values.filter((v) => v !== null && v !== undefined).slice(-60);
    if (pts.length < 2) return;
    let mn = fixedMin !== undefined ? fixedMin : Math.min(...pts);
    let mx = fixedMax !== undefined ? fixedMax : Math.max(...pts);
    if (mx - mn < 1e-6) { mx += 1; mn -= 1; }
    const pad = (mx - mn) * 0.12;
    mn -= pad; mx += pad;
    const X = (i) => (i / (pts.length - 1)) * w;
    const Y = (v) => h - 3 - ((v - mn) / (mx - mn)) * (h - 6);

    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color + '55');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.moveTo(X(0), h);
    pts.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
    ctx.lineTo(X(pts.length - 1), h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    pts.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.stroke();

    const lx = X(pts.length - 1), ly = Y(pts[pts.length - 1]);
    ctx.beginPath();
    ctx.arc(lx, ly, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  /* ---------------- 大图：温度 + 负载 ---------------- */
  function bigChart() {
    const cv = $('chart');
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 600, h = cv.clientHeight || 240;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const N = 120;
    const slice = hist.slice(-N);
    if (slice.length < 2) {
      ctx.fillStyle = '#55637a';
      ctx.font = '12px "Segoe UI","Microsoft YaHei UI",sans-serif';
      ctx.fillText('采集中…', 12, h / 2);
      return;
    }
    const padL = 34, padR = 8, padT = 8, padB = 16;
    const iw = w - padL - padR, ih = h - padT - padB;

    const series = [
      { key: 'cput', color: '#38bdf8', data: slice.map((d) => d.cpu && d.cpu.temp ? d.cpu.temp.c : null), axis: 'temp' },
      { key: 'gput', color: '#a78bfa', data: slice.map((d) => d.gpu ? d.gpu.temp : null), axis: 'temp' },
      { key: 'cpuu', color: '#22d3ee', data: slice.map((d) => d.cpu ? d.cpu.u : null), axis: 'load', dash: [4, 4] },
      { key: 'gpuu', color: '#f472b6', data: slice.map((d) => d.gpu ? d.gpu.util : null), axis: 'load', dash: [4, 4] },
    ];

    const temps = series.filter((s) => s.axis === 'temp').flatMap((s) => s.data).filter((v) => v !== null && v !== undefined);
    let tMax = temps.length ? Math.max(...temps) : 80;
    tMax = Math.ceil((tMax + 5) / 10) * 10;
    tMax = clamp(tMax, 60, 110);
    const tMin = 0;

    const X = (i) => padL + (i / (slice.length - 1)) * iw;
    const YT = (v) => padT + ih - ((v - tMin) / (tMax - tMin)) * ih;
    const YL = (v) => padT + ih - (v / 100) * ih;

    // 网格
    ctx.font = '10px "Segoe UI",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (ih / 4) * i;
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      const tv = tMax - (tMax / 4) * i;
      ctx.fillStyle = '#55637a';
      ctx.fillText(Math.round(tv) + '°', padL - 7, y);
    }
    // 右轴：负载
    ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (ih / 4) * i;
      const lv = 100 - 25 * i;
      ctx.fillStyle = 'rgba(85,99,122,.85)';
      ctx.fillText(lv + '%', w - padR - 24, y);
    }

    // 负载柱背景
    const cpuu = series.find((s) => s.key === 'cpuu').data;
    ctx.fillStyle = 'rgba(34,211,238,.07)';
    const bw = Math.max(1, iw / slice.length - 1);
    cpuu.forEach((v, i) => {
      if (v === null || v === undefined) return;
      const bh = (v / 100) * ih;
      ctx.fillRect(X(i) - bw / 2, padT + ih - bh, bw, bh);
    });

    // 折线
    for (const s of series) {
      const Y = s.axis === 'temp' ? YT : YL;
      ctx.beginPath();
      let started = false;
      s.data.forEach((v, i) => {
        if (v === null || v === undefined) { started = false; return; }
        if (!started) { ctx.moveTo(X(i), Y(v)); started = true; }
        else ctx.lineTo(X(i), Y(v));
      });
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.axis === 'temp' ? 2 : 1.4;
      ctx.setLineDash(s.dash || []);
      ctx.lineJoin = 'round';
      ctx.shadowColor = s.color + '66';
      ctx.shadowBlur = s.axis === 'temp' ? 8 : 0;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }

    // 末端点
    for (const s of series) {
      const Y = s.axis === 'temp' ? YT : YL;
      for (let i = s.data.length - 1; i >= 0; i--) {
        const v = s.data[i];
        if (v === null || v === undefined) continue;
        ctx.beginPath();
        ctx.arc(X(i), Y(v), 2.4, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
        break;
      }
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#55637a';
    ctx.fillText('-' + Math.round(slice.length) + 's', padL, h - 3);
    ctx.textAlign = 'right';
    ctx.fillText('现在', w - padR, h - 3);
  }

  /* ---------------- 渲染 ---------------- */
  function render(d) {
    if (!d) return;
    const h = d.h || {};

    if (h.name) {
      const parts = [h.name, h.cpu, d.gpu ? d.gpu.name : (h.model || '')].filter(Boolean);
      $('hostline').textContent = parts.join('  ·  ');
      $('hostline').title = [h.os, h.board, h.model].filter(Boolean).join(' | ');
    }
    $('uptime').textContent = dur(d.up);

    /* CPU 温度 */
    const t = d.cpu && d.cpu.temp ? d.cpu.temp : {};
    const tc = t.c;
    const tempEl = $('v-temp');
    if (tc === null || tc === undefined) {
      tempEl.textContent = '--'; tempEl.classList.add('na');
      ring($('ring-temp'), 0, '#55637a');
      $('tag-temp').textContent = '无传感器';
      $('f-temp').textContent = '未发现可读的温度源';
    } else {
      tempEl.textContent = fmt(tc, 1); tempEl.classList.remove('na');
      ring($('ring-temp'), (tc / 100) * 100, tempColor(tc));
      $('tag-temp').textContent = t.src === 'LHM' ? '内核 DTS' : (t.src === 'ACPI' ? 'ACPI 热区' : '未知');
      const zs = (t.zones || []).map((z) => z.n + ' ' + fmt(z.c, 1) + '°C').join(' · ');
      $('f-temp').textContent = t.src === 'LHM' ? t.label : (t.label || '') + (t.src === 'ACPI' ? ' · 主板热区' : '');
      $('f-temp').title = (t.src === 'LHM'
        ? '来自 LibreHardwareMonitor 的 CPU Package 温度'
        : 'ACPI 热区由主板提供，桌面台式机通常不随 CPU 负载变化。安装并运行 LibreHardwareMonitor（管理员）后本程序会自动切换为真实内核温度。')
        + (zs ? '\n各热区：' + zs : '');
      const card = $('card-cputemp');
      card.classList.toggle('hot', tc >= 85); card.classList.toggle('warm', tc >= 75 && tc < 85);
      card.classList.toggle('flash', tc >= 90);
    }

    /* CPU 占用 */
    const cu = d.cpu ? d.cpu.u : null;
    $('v-cpu').textContent = fmt(cu, 0);
    ring($('ring-cpu'), cu, '#38bdf8');
    $('tag-cpu').textContent = (d.cpu && d.cpu.cores) ? d.cpu.cores.length + ' 线程' : '--';
    const fq = d.cpu && d.cpu.f ? (d.cpu.f / 1000).toFixed(2) + ' GHz' : '--';
    $('f-cpu').textContent = '频率 ' + fq + (d.cpu && d.cpu.mf ? ' / 峰值 ' + (d.cpu.mf / 1000).toFixed(2) + ' GHz' : '');

    /* GPU */
    const g = d.gpu;
    if (g) {
      $('v-gputemp').textContent = fmt(g.temp, 0);
      ring($('ring-gputemp'), g.temp, tempColor(g.temp));
      $('tag-gputemp').textContent = 'NVML';
      $('f-gputemp').textContent = '风扇 ' + (g.fan === null ? '--' : g.fan + '%') + ' · 功耗 ' + fmt(g.power, 0) + ' W';
      $('card-gputemp').classList.toggle('hot', g.temp >= 83);
      $('card-gputemp').classList.toggle('warm', g.temp >= 75 && g.temp < 83);

      $('v-gpu').textContent = fmt(g.util, 0);
      ring($('ring-gpu'), g.util, '#a78bfa');
      $('tag-gpu').textContent = 'RTX';
      $('f-gpu').textContent = '显存 ' + fmt(g.memUsed, 0) + ' / ' + fmt(g.memTotal, 0) + ' MB';

      $('tag-gpudetail').textContent = 'NVIDIA';
      $('vram-bar').style.width = clamp((g.memUsed / g.memTotal) * 100, 0, 100) + '%';
      $('vram-txt').textContent = '显存 ' + fmt(g.memUsed / 1024, 1) + ' / ' + fmt(g.memTotal / 1024, 1) + ' GB';
      $('g-clock').textContent = fmt(g.clock, 0) + ' MHz';
      $('g-mclock').textContent = fmt(g.memClock, 0) + ' MHz';
      $('g-fan').textContent = g.fan === null ? '--' : fmt(g.fan, 0) + ' %';
      $('g-pow').textContent = fmt(g.power, 0) + ' / ' + fmt(g.powerMax, 0) + ' W';
    } else {
      $('v-gputemp').textContent = '--'; $('v-gpu').textContent = '--';
      ring($('ring-gputemp'), 0, '#55637a'); ring($('ring-gpu'), 0, '#55637a');
      $('tag-gputemp').textContent = '无 GPU'; $('tag-gpu').textContent = '无 GPU';
      $('f-gputemp').textContent = '未检测到 NVIDIA GPU'; $('f-gpu').textContent = '—';
      $('g-clock').textContent = $('g-mclock').textContent = $('g-fan').textContent = $('g-pow').textContent = '--';
      $('vram-bar').style.width = '0%'; $('vram-txt').textContent = '--';
    }

    /* 内存 */
    const m = d.mem || {};
    $('mem-used').innerHTML = fmt(m.used, 1) + '<small>GB</small>';
    $('mem-total').textContent = '共 ' + fmt(m.total, 1) + ' GB';
    $('mem-bar').style.width = clamp(m.pct || 0, 0, 100) + '%';
    $('tag-mem').textContent = fmt(m.pct, 0) + '%';
    $('mem-page').textContent = '页面文件 ' + fmt(m.page, 1) + ' / ' + fmt(m.pageT, 1) + ' GB';

    /* 磁盘 */
    const dk = d.disk || { r: 0, w: 0, vols: [] };
    $('disk-rw').innerHTML = fmt(dk.r, 1) + '<small>MB/s 读</small>';
    $('disk-rw2').textContent = '写 ' + fmt(dk.w, 1) + ' MB/s';
    $('tag-vols').textContent = (dk.vols || []).length + ' 个分区';
    $('vols').innerHTML = (dk.vols || []).map((v) => {
      const c = v.pct >= 90 ? '#f87171' : v.pct >= 75 ? '#fbbf24' : '#34d399';
      return `<div class="vol"><span>${esc(v.d)}</span><span class="vbar"><span style="width:${clamp(v.pct, 0, 100)}%;background:${c}"></span></span><b>${v.free}G</b></div>`;
    }).join('');

    /* 网络 */
    const n = d.net || { rx: 0, tx: 0, a: [] };
    const hr = (kb) => kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB/s' : kb.toFixed(0) + ' KB/s';
    $('net-rx').innerHTML = hr(n.rx).replace(' ', '<small> ') + '</small>';
    $('net-tx').textContent = '↑ ' + hr(n.tx);
    const shortNic = (s) => String(s).replace(/\[R\]/gi, '').replace(/Family Controller|Gaming|Adapter|Connection/gi, '').replace(/\s+/g, ' ').trim();
    $('tag-net').textContent = (n.a && n.a.length) ? shortNic(n.a[0].n).slice(0, 15) : '空闲';

    /* 逐核 */
    const cores = (d.cpu && d.cpu.cores) || [];
    const cl = $('corelist');
    if (cl.childElementCount !== cores.length) {
      cl.innerHTML = cores.map((_, i) => `<div class="core"><div class="col" style="height:2%"></div><div class="cl">${i}</div></div>`).join('');
    }
    Array.from(cl.children).forEach((el, i) => {
      const v = clamp(cores[i] || 0, 0, 100);
      const col = el.querySelector('.col');
      col.style.height = Math.max(3, v) + '%';
      col.style.background = v > 85 ? 'linear-gradient(180deg,#f87171,rgba(248,113,113,.35))'
        : v > 60 ? 'linear-gradient(180deg,#fbbf24,rgba(251,191,36,.3))'
        : 'linear-gradient(180deg,#38bdf8,rgba(56,189,248,.3))';
    });
    $('tag-cores').textContent = cores.length + ' 线程';

    /* 进程 */
    const body = $('procbody');
    body.innerHTML = (d.procs || []).slice(0, 5).map((p) => {
      const w = clamp(p.p, 0, 100);
      return `<tr><td title="${esc(p.n)} (PID ${p.pid})">${esc(p.n)}</td><td class="num">${fmt(p.p, 1)}%</td><td class="num">${fmt(p.m, 0)} MB</td><td><span class="pbar"><span style="width:${w}%"></span></span></td></tr>`;
    }).join('');

    /* 趋势图 */
    const temps = hist.map((x) => (x.cpu && x.cpu.temp) ? x.cpu.temp.c : null);
    const gtemps = hist.map((x) => x.gpu ? x.gpu.temp : null);
    const utils = hist.map((x) => x.cpu ? x.cpu.u : null);
    const gutils = hist.map((x) => x.gpu ? x.gpu.util : null);

    spark($('sp-temp'), temps, tc !== null && tc !== undefined ? tempColor(tc) : '#38bdf8');
    spark($('sp-cpu'), utils, '#38bdf8', 0, 100);
    spark($('sp-gputemp'), gtemps, '#a78bfa');
    spark($('sp-gpu'), gutils, '#a78bfa', 0, 100);

    $('lg-cput').textContent = fmt(tc, 1) + '°C';
    $('lg-gput').textContent = g ? fmt(g.temp, 0) + '°C' : '--';
    $('lg-cpuu').textContent = fmt(cu, 0) + '%';
    $('lg-gpuu').textContent = g ? fmt(g.util, 0) + '%' : '--';

    bigChart();
  }

  function push(d) {
    hist.push(d);
    if (hist.length > MAXP) hist.shift();
    render(d);
  }

  /* ---------------- SSE ---------------- */
  function connect() {
    const es = new EventSource('/stream');

    es.addEventListener('history', (ev) => {
      try {
        const items = JSON.parse(ev.data);
        hist = Array.isArray(items) ? items.slice(-MAXP) : [];
        if (hist.length) render(hist[hist.length - 1]);
      } catch (e) { }
    });

    es.addEventListener('sample', (ev) => {
      try { push(JSON.parse(ev.data)); } catch (e) { }
    });

    es.onopen = () => {
      $('conn').className = 'pill';
      $('conn').querySelector('span').textContent = '实时连接';
    };
    es.onerror = () => {
      $('conn').className = 'pill off';
      $('conn').querySelector('span').textContent = '重连中';
    };
  }

  /* ---------------- 时钟 / 退出 ---------------- */
  function clock() {
    const d = new Date();
    $('clock').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
  }
  clock();
  setInterval(clock, 1000);

  $('quit').addEventListener('click', async () => {
    $('conn').className = 'pill dead';
    $('conn').querySelector('span').textContent = '已退出';
    try { await fetch('/api/quit', { method: 'POST' }); } catch (e) { }
    setTimeout(() => { window.close(); document.body.innerHTML = '<div style="padding:40px;color:#7d8b9e">监控已停止，可关闭此窗口。</div>'; }, 300);
  });

  window.addEventListener('resize', () => { bigChart(); render(hist[hist.length - 1]); });

  connect();
})();
</script>
</body>
</html>
